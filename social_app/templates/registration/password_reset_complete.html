{% extends "base.html" %}

{% block title %}Password reset complete — Bookmarks{% endblock %}

{% block content %}
<div class="success-container scroll-reveal" style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div class="success-icon" style="font-size: 5rem; margin-bottom: 2rem;">🔓</div>
    <h1 class="gradient-text" style="font-size: 3.5rem; margin-bottom: 1.5rem;">Access Restored.</h1>
    <p style="color: var(--foreground-muted); font-size: 1.1rem; line-height: 1.7; margin-bottom: 3rem;">
        Your password has been successfully reset. You can now use your new credentials to sign back into your account.
    </p>
    <div class="card" style="padding: 2rem;">
        <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%; padding: 1rem;">Sign in to your account →</a>
    </div>
</div>
{% endblock %}
