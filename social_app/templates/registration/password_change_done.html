{% extends "base.html" %}

{% block title %}Password changed — Bookmarks{% endblock %}

{% block content %}
<div class="success-container scroll-reveal" style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div class="success-icon" style="font-size: 5rem; margin-bottom: 2rem;">🛡️</div>
    <h1 class="gradient-text" style="font-size: 3.5rem; margin-bottom: 1.5rem;">Secure.</h1>
    <p style="color: var(--foreground-muted); font-size: 1.1rem; line-height: 1.7; margin-bottom: 3rem;">
        Your password has been successfully updated. Your account is now even more secure.
    </p>
    <div class="card" style="padding: 2rem;">
        <a href="{% url 'dashboard' %}" class="btn btn-primary" style="width: 100%; padding: 1rem;">Go to Dashboard →</a>
    </div>
</div>
{% endblock %}
